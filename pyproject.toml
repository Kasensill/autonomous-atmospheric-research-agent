[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-research-agent"
version = "0.1.0"
description = "A learning-focused Autonomous Research Agent built with LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0,<2.0",
    "dashscope>=1.20,<2.0",
    "jieba>=0.42,<1.0",
    "langgraph>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "pydantic>=2.7,<3.0",
    "pypdf>=5.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "rank-bm25>=0.2,<1.0",
    "trafilatura>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "fastapi>=0.115,<1.0"]
ui = ["streamlit>=1.40,<2.0", "httpx>=0.27,<1.0"]
api = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]
corpus = ["PyMuPDF>=1.24,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
